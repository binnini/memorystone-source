<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 700 320" role="img" aria-label="CanEnter 단일 술어 구조. 탐색기는 진입 가능성을 오직 CanEnter에게만 묻고, CanEnter 안에서 중심 칸 검사와 원판 클리어런스와 형상 footprint 검사가 모두 처리된다. 그래서 멀티셀 보스를 위해 새 경로탐색기를 만들 필요가 없다."><rect x="0" y="0" width="700" height="320" fill="#FFFDFA"/>
        <defs>
          <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/>
          </marker>
          <marker id="a5s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#B33A35"/>
          </marker>
        </defs>

        <rect x="30" y="40" width="180" height="46" fill="none" stroke="#1B1A1E" stroke-width="1.4"/>
        <text x="120" y="60" text-anchor="middle" font-size="12.5" fill="#1B1A1E" font-weight="500">GetReachableCells</text>
        <text x="120" y="76" text-anchor="middle" font-size="10.5" fill="#1B1A1E" opacity=".6">이동 범위 하이라이트</text>

        <rect x="30" y="110" width="180" height="46" fill="none" stroke="#1B1A1E" stroke-width="1.4"/>
        <text x="120" y="130" text-anchor="middle" font-size="12.5" fill="#1B1A1E" font-weight="500">FindPath</text>
        <text x="120" y="146" text-anchor="middle" font-size="10.5" fill="#1B1A1E" opacity=".6">실제 경로 복원</text>

        <rect x="270" y="75" width="170" height="46" fill="none" stroke="#1B1A1E" stroke-width="1.6"/>
        <text x="355" y="95" text-anchor="middle" font-size="12.5" fill="#1B1A1E" font-weight="500">CalculateDistances</text>
        <text x="355" y="111" text-anchor="middle" font-size="10.5" fill="#1B1A1E" opacity=".6">둘이 공유하는 탐색</text>

        <line x1="210" y1="63" x2="266" y2="88" stroke="#1B1A1E" stroke-width="1.2" marker-end="url(#a5)"/>
        <line x1="210" y1="133" x2="266" y2="108" stroke="#1B1A1E" stroke-width="1.2" marker-end="url(#a5)"/>

        <rect x="500" y="75" width="170" height="46" fill="none" stroke="#B33A35" stroke-width="1.8"/>
        <text x="585" y="95" text-anchor="middle" font-size="12.5" fill="#B33A35" font-weight="600">CanEnter</text>
        <text x="585" y="111" text-anchor="middle" font-size="10.5" fill="#B33A35">유일한 진입 질의</text>

        <line x1="440" y1="98" x2="496" y2="98" stroke="#B33A35" stroke-width="1.6" marker-end="url(#a5s)"/>
        <text x="468" y="88" text-anchor="middle" font-size="10" fill="#B33A35">이웃마다</text>

        <!-- inside CanEnter -->
        <rect x="440" y="170" width="230" height="34" fill="none" stroke="#1B1A1E" stroke-width="1"/>
        <text x="555" y="191" text-anchor="middle" font-size="11.5" fill="#1B1A1E">① 중심 칸 — 높이 규칙 · 진입 비용</text>
        <rect x="440" y="214" width="230" height="34" fill="none" stroke="#1B1A1E" stroke-width="1"/>
        <text x="555" y="235" text-anchor="middle" font-size="11.5" fill="#1B1A1E">② 형상 footprint 칸들</text>
        <rect x="440" y="258" width="230" height="34" fill="none" stroke="#1B1A1E" stroke-width="1"/>
        <text x="555" y="279" text-anchor="middle" font-size="11.5" fill="#1B1A1E">③ 반경 R 원판의 나머지 칸</text>

        <line x1="585" y1="121" x2="585" y2="166" stroke="#B33A35" stroke-width="1.4" marker-end="url(#a5s)"/>

        <text x="30" y="196" font-size="12" fill="#1B1A1E" font-weight="500">탐색기는 ②③의</text>
        <text x="30" y="216" font-size="12" fill="#1B1A1E" font-weight="500">존재를 모른다.</text>
        <text x="30" y="248" font-size="11.5" fill="#1B1A1E" opacity=".7">멀티셀 보스를 넣으려고</text>
        <text x="30" y="266" font-size="11.5" fill="#1B1A1E" opacity=".7">새 경로탐색기를 만들지</text>
        <text x="30" y="284" font-size="11.5" fill="#1B1A1E" opacity=".7">않아도 되는 이유.</text>
      </svg>