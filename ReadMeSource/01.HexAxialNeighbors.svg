<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 700 360" role="img" aria-label="축좌표 육각 격자. 중심 (0,0)을 둘러싼 여섯 이웃이 각각 (1,0) (1,-1) (0,-1) (-1,0) (-1,1) (0,1)이고, 짝수 행 홀수 행 구분 없이 오프셋 표 한 벌로 모두 구해진다."><rect x="0" y="0" width="700" height="360" fill="#FFFDFA"/>
        <defs>
          <polygon id="hx" points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"/>
        </defs>
        <g transform="translate(250,170)">
          <use href="#hx" x="0" y="0" fill="none" stroke="#B33A35" stroke-width="2"/>
          <text x="0" y="-2" text-anchor="middle" font-size="12" fill="#B33A35" font-weight="600">0,0</text>
          <text x="0" y="12" text-anchor="middle" font-size="9.5" fill="#B33A35">s=0</text>

          <use href="#hx" x="45" y="0" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="45" y="-2" text-anchor="middle" font-size="12" fill="#1B1A1E">1,0</text>
          <text x="45" y="12" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=-1</text>

          <use href="#hx" x="22.5" y="-39" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="22.5" y="-41" text-anchor="middle" font-size="12" fill="#1B1A1E">1,-1</text>
          <text x="22.5" y="-27" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=0</text>

          <use href="#hx" x="-22.5" y="-39" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="-22.5" y="-41" text-anchor="middle" font-size="12" fill="#1B1A1E">0,-1</text>
          <text x="-22.5" y="-27" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=1</text>

          <use href="#hx" x="-45" y="0" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="-45" y="-2" text-anchor="middle" font-size="12" fill="#1B1A1E">-1,0</text>
          <text x="-45" y="12" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=1</text>

          <use href="#hx" x="-22.5" y="39" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="-22.5" y="37" text-anchor="middle" font-size="12" fill="#1B1A1E">-1,1</text>
          <text x="-22.5" y="51" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=0</text>

          <use href="#hx" x="22.5" y="39" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
          <text x="22.5" y="37" text-anchor="middle" font-size="12" fill="#1B1A1E">0,1</text>
          <text x="22.5" y="51" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".55">s=-1</text>
        </g>

        <line x1="430" y1="60" x2="430" y2="300" stroke="#1B1A1E" stroke-width="1" opacity=".25"/>

        <text x="470" y="78" font-size="12" fill="#1B1A1E" font-weight="500">DirectionOffsets — 한 벌뿐이다</text>
        <text x="470" y="106" font-size="11.5" fill="#1B1A1E" opacity=".8" font-family="monospace">( 1, 0)   ( 1,-1)   ( 0,-1)</text>
        <text x="470" y="126" font-size="11.5" fill="#1B1A1E" opacity=".8" font-family="monospace">(-1, 0)   (-1, 1)   ( 0, 1)</text>
        <text x="470" y="160" font-size="11.5" fill="#1B1A1E" opacity=".65">짝수 행 / 홀수 행 분기가</text>
        <text x="470" y="178" font-size="11.5" fill="#1B1A1E" opacity=".65">코드에 존재하지 않는다.</text>
        <text x="470" y="214" font-size="11.5" fill="#B33A35">이웃 = this + 오프셋</text>
        <text x="470" y="232" font-size="11.5" fill="#B33A35">한 줄로 끝난다.</text>
        <text x="470" y="268" font-size="11" fill="#1B1A1E" opacity=".5">모든 칸에서 q+r+s = 0</text>
      </svg>