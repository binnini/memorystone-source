<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 780 430" role="img" aria-label="턴 경계 16단계 파이프라인. 방어도 해제는 필드 오브젝트 틱보다 앞이어야 하고, 유물 턴 감소는 유물 턴 시작 훅보다 앞이어야 하며, 턴 신호 리셋은 지속 효과 턴 시작보다 뒤여야 한다."><rect x="0" y="0" width="780" height="430" fill="#FFFDFA"/>
        <defs>
          <marker id="s2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#B33A35"/>
          </marker>
        </defs>
        <text x="14" y="18" font-size="11" fill="#1B1A1E" opacity=".6">BeginNextOverallTurn — 위에서 아래로</text>

        <g font-size="11.5" fill="#1B1A1E">
          <text x="14" y="46">①</text><text x="36" y="46">AdvanceOverallTurnCounter</text>
          <text x="14" y="72" fill="#B33A35" font-weight="600">②</text><text x="36" y="72" fill="#B33A35" font-weight="600">ClearPlayerBlock — 방어도 해제</text>
          <text x="14" y="98">③</text><text x="36" y="98">ActivatePendingFieldObjects</text>
          <text x="14" y="124" fill="#B33A35" font-weight="600">④</text><text x="36" y="124" fill="#B33A35" font-weight="600">ResolveFieldObjectTick — 장판 피해</text>
          <text x="14" y="150" fill="#B33A35" font-weight="600">⑤</text><text x="36" y="150" fill="#B33A35" font-weight="600">ApplyActiveEffectTurnStart</text>
          <text x="14" y="176">⑥</text><text x="36" y="176">RefillKiForNewTurn</text>
          <text x="14" y="202" fill="#B33A35" font-weight="600">⑦</text><text x="36" y="202" fill="#B33A35" font-weight="600">TickLimitedRelicTurns</text>
          <text x="14" y="228" fill="#B33A35" font-weight="600">⑧</text><text x="36" y="228" fill="#B33A35" font-weight="600">ResolveTurnStartRelicTriggers</text>
        </g>
        <g font-size="11.5" fill="#1B1A1E">
          <text x="424" y="46">⑨</text><text x="448" y="46">ApplyCarriedMovementBonus</text>
          <text x="424" y="72">⑩</text><text x="448" y="72">ApplyPendingSelfImmobilize</text>
          <text x="424" y="98">⑪</text><text x="448" y="98">ApplyPendingProvokeStrength</text>
          <text x="424" y="124" fill="#B33A35" font-weight="600">⑫</text><text x="448" y="124" fill="#B33A35" font-weight="600">ResetPerTurnSignals</text>
          <text x="424" y="150">⑬</text><text x="448" y="150">AdvanceAndExpirePlayerProps</text>
          <text x="424" y="176">⑭</text><text x="448" y="176">RefreshVisionForNewTurn</text>
          <text x="424" y="202">⑮</text><text x="448" y="202">RefreshMonsterIntent</text>
          <text x="424" y="228">⑯</text><text x="448" y="228">EnterPlayerMovementPhase</text>
        </g>

        <path d="M8,68 C -6,68 -6,124 8,124" fill="none" stroke="#B33A35" stroke-width="1.4" marker-end="url(#s2b)"/>
        <path d="M8,198 C -6,198 -6,224 8,224" fill="none" stroke="#B33A35" stroke-width="1.4" marker-end="url(#s2b)"/>
        <path d="M300,146 C 380,146 380,120 418,120" fill="none" stroke="#B33A35" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s2b)"/>

        <line x1="14" y1="266" x2="766" y2="266" stroke="#1B1A1E" stroke-width="1" opacity=".2"/>

        <text x="14" y="292" font-size="12" fill="#B33A35" font-weight="600">② → ④  방어도 해제가 장판 피해보다 앞</text>
        <text x="36" y="312" font-size="11.5" fill="#1B1A1E" opacity=".8">뒤집으면 <tspan font-weight="600">지난 턴 방어도가 이번 턴 장판 피해를 흡수한다</tspan> — 완전히 다른 게임.</text>

        <text x="14" y="344" font-size="12" fill="#B33A35" font-weight="600">⑦ → ⑧  유물 턴 감소가 턴 시작 훅보다 앞</text>
        <text x="36" y="364" font-size="11.5" fill="#1B1A1E" opacity=".8">뒤집으면 이번 턴 만료된 유물이 훅을 <tspan font-weight="600">한 번 더</tspan> 돈다.</text>

        <text x="14" y="396" font-size="12" fill="#B33A35" font-weight="600">⑤ → ⑫  신호 리셋이 지속 효과 처리보다 뒤</text>
        <text x="36" y="416" font-size="11.5" fill="#1B1A1E" opacity=".8">앞으로 옮기면 약오름 적립이 <tspan font-weight="600">판정 전에 지워진다</tspan>.</text>
      </svg>