<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="현재 구현에서 결정이 실제로 일어나는 자리"><rect x="0" y="0" width="880" height="260" fill="#FFFDFA"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/></marker></defs>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12.5" fill="#1B1A1E">
    <rect x="20" y="40" width="200" height="120" fill="none" stroke="#1B1A1E" stroke-dasharray="4 3"/>
    <text x="32" y="62" font-weight="600">「행동 트리」가 정하는 것</text>
    <text x="32" y="86" font-size="11.5">의도 enum 하나:</text>
    <text x="32" y="104" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">Patrol · Chase · Attack</text>
    <text x="32" y="122" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">Search · Return</text>
    <text x="32" y="148" font-size="11" opacity=".7">입력은 거리 정수 3개 + 죽음·은신 비트</text>
    <line x1="220" y1="100" x2="258" y2="100" stroke="#1B1A1E" marker-end="url(#b)"/>
    <rect x="260" y="20" width="600" height="160" fill="#EFEBE4" stroke="#1B1A1E"/>
    <text x="274" y="42" font-weight="600">플래너(절차 코드)가 정하는 것 — 게임이 실제로 보는 결정</text>
    <text x="274" y="68" font-size="12">• <tspan font-weight="600">어느 칸으로</tspan>: 인접 6칸 중 형상이 덮는 곳(:1146) → 없으면 플레이어 쪽 최단 경로를 이동력만큼(:997)</text>
    <text x="274" y="90" font-size="12">• <tspan font-weight="600">어느 패턴을</tspan>: 페이즈 창 → 거리 창 → 쿨다운 → 커버 → 가중치 추첨(:419–465)</text>
    <text x="274" y="112" font-size="12">• <tspan font-weight="600">뛸 것인가</tspan>: 걸어서 못 덮을 때만 도약(:627)</text>
    <text x="274" y="134" font-size="12">• <tspan font-weight="600">어디를 겨눌지</tspan>: 이동 종료 시점에 잠금(:143–150)</text>
    <text x="274" y="162" font-size="11" opacity=".75">의도 enum은 여기서 「이동 목적지 종류」를 고르는 분기 키(:968)로만 쓰인다. Attack이 나와도 못 덮으면 Chase로 되돌린다(:257).</text>
    <text x="20" y="215" font-size="12">즉 이 코드베이스의 AI 「지능」은 트리에 있지 않다. 트리는 <tspan font-weight="600">이동 의도 5종을 고르는 얇은 층</tspan>이고, 위치·패턴·조준은 플래너의 절차 코드가 정한다.</text>
    <text x="20" y="235" font-size="12">일반적인 BT 설계라면 「자리 잡기」「패턴 고르기」「도약」이 각각 리프 노드가 되어 트리 안에 있었을 것이다.</text>
  </g>
</svg>