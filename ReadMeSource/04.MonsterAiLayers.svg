<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="몬스터 AI 3층과 데코레이터 스택"><rect x="0" y="0" width="880" height="330" fill="#FFFDFA"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/></marker></defs>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="13" fill="#1B1A1E">
    <!-- decision -->
    <rect x="20" y="30" width="250" height="230" rx="2" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
    <text x="34" y="52" font-weight="600">① 판단 — <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">IMonsterAi.Step</tspan></text>
    <text x="34" y="72" font-size="11.5" opacity=".7">입력 MonsterFsmContext · 출력 EnemyIntent · 부작용 FsmMemory</text>
    <rect x="34" y="88" width="222" height="26" fill="#F0E2DF" stroke="#B33A35"/>
    <text x="44" y="106" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">StealthMaskingMonsterAi</text>
    <rect x="48" y="122" width="208" height="26" fill="#F0E2DF" stroke="#B33A35"/>
    <text x="58" y="140" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">BlindedSenseMaskingMonsterAi</text>
    <rect x="62" y="156" width="194" height="26" fill="none" stroke="#1B1A1E" stroke-dasharray="3 3"/>
    <text x="72" y="174" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">AmbushMonsterAi (B002만)</text>
    <rect x="76" y="190" width="180" height="26" fill="#EFEBE4" stroke="#1B1A1E"/>
    <text x="86" y="208" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">MonsterBehaviorTreeAi</text>
    <text x="34" y="242" font-size="11.5" opacity=".7">MonsterFsm.Step — 출하 호출 0 · 테스트 8건만</text>
    <!-- plan -->
    <rect x="310" y="30" width="250" height="230" rx="2" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
    <text x="324" y="52" font-weight="600">② 계획 — <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">MonsterAiPlanner</tspan></text>
    <text x="324" y="72" font-size="11.5" opacity=".7">1,254줄 · IMonsterPlanningContext만 본다</text>
    <text x="324" y="100" font-size="12.5">이동 목적지 (FindPath · 예약)</text>
    <text x="324" y="122" font-size="12.5">공격 패턴 추첨 (가중치 RNG)</text>
    <text x="324" y="144" font-size="12.5">도약 · 조준 잠금</text>
    <text x="324" y="166" font-size="12.5">→ <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">MonsterRuntime.TurnPlan</tspan> 커밋</text>
    <text x="324" y="200" font-size="11.5" opacity=".7">가변 상태 = 패턴 RNG · 변주 RNG 2개뿐</text>
    <text x="324" y="218" font-size="11.5" opacity=".7">시드: RunSeedStreams.MonsterAttackPattern</text>
    <!-- resolve -->
    <rect x="600" y="30" width="260" height="230" rx="2" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
    <text x="614" y="52" font-weight="600">③ 해소 — <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12">CombatState.MonsterAi</tspan></text>
    <text x="614" y="72" font-size="11.5" opacity=".7">1,277줄 파셜 · 호스트 상태를 직접 쓴다</text>
    <text x="614" y="100" font-size="12.5">ResolveMonsterMovementStep</text>
    <text x="614" y="122" font-size="12.5">ResolveMonsterAttackStep (322줄)</text>
    <text x="614" y="144" font-size="12.5">피해·넉백·상태·지대·소환·연출 이벤트</text>
    <text x="614" y="178" font-size="12.5">GetMonsterIntentPreviews</text>
    <text x="614" y="196" font-size="11.5" opacity=".7">= TurnPlan을 읽어 화면용으로 펼친다</text>
    <line x1="270" y1="145" x2="308" y2="145" stroke="#1B1A1E" stroke-width="1.2" marker-end="url(#ar)"/>
    <line x1="560" y1="145" x2="598" y2="145" stroke="#1B1A1E" stroke-width="1.2" marker-end="url(#ar)"/>
    <text x="30" y="300" font-size="12" opacity=".75">경계 선언: CombatState.MonsterAi.cs:12–16. 계획부는 컨텍스트 밖을 만지지 않고, 해소부는 계획부의 술어(IsActiveMonsterAttackAreaCoveringPlayer 등)를 <tspan font-weight="600">빌려 쓴다</tspan>.</text>
    <text x="30" y="318" font-size="12" opacity=".75">프로파일 캐시(CombatState.cs:631) — 18종 중 B002는 어둑시니 1종, 나머지 17종 B001.</text>
  </g>
</svg>