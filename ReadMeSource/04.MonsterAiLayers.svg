<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="몬스터 AI 세 층. 계획기는 IMonsterPlanningContext 표면만 보고 TurnPlan을 커밋하며, 해소부는 CombatState 파셜이 그 계획을 굴린다." style="color:#1B1A1E" font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12">
<rect x="0" y="0" width="880" height="330" fill="#FFFDFA"/>
<!-- box 1: context -->
<rect x="20" y="30" width="250" height="220" fill="none" stroke="#1B1A1E" stroke-width="1.5"/>
<text x="34" y="54" font-weight="600" font-size="13">① 컨텍스트 · 계획기 입구</text>
<text x="34" y="74" fill="#55515C" font-size="11">IMonsterPlanningContext 술어만 읽는다</text>
<text x="34" y="104" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">거리 · 감지 범위 · 사거리</text>
<text x="34" y="124" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">PlayerHidden ← 은신 ∨ 실명</text>
<text x="34" y="144" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">behaviorProfileRef (매복 B002)</text>
<rect x="34" y="166" width="222" height="66" fill="#F0E2DF" stroke="#B33A35" stroke-width="1"/>
<text x="44" y="186" fill="#B33A35" font-size="11" font-weight="600">DEC-2026-09-05-03 · cs:1370</text>
<text x="44" y="204" fill="#B33A35" font-size="11">FSM · 행동 트리 · 데코레이터 3종 은퇴</text>
<text x="44" y="222" fill="#B33A35" font-size="11">마스킹은 비트 하나, 매복은 분기 하나</text>
<!-- arrow -->
<line x1="270" y1="140" x2="308" y2="140" stroke="#1B1A1E" stroke-width="1.5"/>
<polygon points="308,135 318,140 308,145" fill="#1B1A1E"/>
<!-- box 2: planner -->
<rect x="318" y="30" width="250" height="220" fill="none" stroke="#1B1A1E" stroke-width="1.5"/>
<text x="332" y="54" font-weight="600" font-size="13">② 계획 — MonsterAiPlanner</text>
<text x="332" y="74" fill="#55515C" font-size="11">위에서 아래로 한 번 흐른다</text>
<text x="332" y="104" font-size="11.5">의도 선택 <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace">SelectMovementIntent</tspan> if/else</text>
<text x="332" y="124" font-size="11.5">이동 목적지 (FindPath · 예약 칸은 막힘)</text>
<text x="332" y="144" font-size="11.5">공격 패턴 추첨 (가중치 RNG · 스트림 4)</text>
<text x="332" y="164" font-size="11.5">도약 · 조준 잠금</text>
<text x="332" y="190" font-size="11.5" font-weight="600">→ <tspan font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace">MonsterRuntime.TurnPlan</tspan> 커밋</text>
<text x="332" y="218" fill="#55515C" font-size="11">가변 상태 = 패턴 RNG · 변주 RNG 둘뿐</text>
<text x="332" y="236" fill="#55515C" font-size="11">호스트 내부를 만지지 않는다</text>
<!-- arrow -->
<line x1="568" y1="140" x2="606" y2="140" stroke="#1B1A1E" stroke-width="1.5"/>
<polygon points="606,135 616,140 606,145" fill="#1B1A1E"/>
<!-- box 3: resolve -->
<rect x="616" y="30" width="244" height="220" fill="none" stroke="#1B1A1E" stroke-width="1.5"/>
<text x="630" y="54" font-weight="600" font-size="13">③ 해소 — CombatState.MonsterAi</text>
<text x="630" y="74" fill="#55515C" font-size="11">커밋된 계획을 실제로 굴린다</text>
<text x="630" y="104" font-size="11.5">이동: 목적지를 믿고 경로는 다시 잰다</text>
<text x="630" y="124" font-size="11.5">공격: 커버를 다시 묻고 못 덮으면 빗맞음</text>
<text x="630" y="144" font-size="11.5">피해 · 넉백 · 상태 · 지대 · 소환 · 연출 이벤트</text>
<text x="630" y="176" font-size="11.5" font-weight="600">GetMonsterIntentPreviews</text>
<text x="630" y="194" font-size="11.5">= TurnPlan을 읽어 화면용으로 펼친다</text>
<text x="630" y="212" fill="#55515C" font-size="11">AI를 다시 돌리지 않는다 — 투영</text>
<text x="630" y="236" fill="#55515C" font-size="11">피해 산식은 집행과 같은 함수</text>
<!-- footer -->
<line x1="20" y1="272" x2="860" y2="272" stroke="#DCD6CD" stroke-width="1"/>
<text x="20" y="294" font-size="11" fill="#55515C">경계: 계획부는 컨텍스트 밖을 만지지 않고, 해소부는 계획부의 술어(IsActiveMonsterAttackAreaCoveringPlayer 등)를 빌려 쓴다.</text>
<text x="20" y="312" font-size="11" fill="#55515C">계획은 턴 경계에서 몬스터마다 1회, 행동 순서대로 돌며 목적지를 예약한다 — 두 몬스터가 같은 칸으로 해석되지 않는다.</text>
</svg>
