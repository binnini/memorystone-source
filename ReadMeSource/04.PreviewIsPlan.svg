<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="계획·예고·해소가 같은 함수를 공유하는 구조"><rect x="0" y="0" width="880" height="400" fill="#FFFDFA"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/></marker></defs>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12.5" fill="#1B1A1E">
    <!-- top row: RefreshTurnPlan steps -->
    <text x="20" y="30" font-weight="600">RefreshTurnPlan — 턴 경계에 몬스터마다 1회 (MonsterAiPlanner.cs:117)</text>
    <g>
      <rect x="20" y="46" width="150" height="46" fill="none" stroke="#1B1A1E"/><text x="30" y="65">AI.Step → intent</text><text x="30" y="82" font-size="10.5" opacity=".7">FsmMemory 변이는 여기만</text>
      <rect x="196" y="46" width="150" height="46" fill="none" stroke="#1B1A1E"/><text x="206" y="65">Normalize</text><text x="206" y="82" font-size="10.5" opacity=".7">Attack인데 못 덮으면 Chase/Search</text>
      <rect x="372" y="46" width="150" height="46" fill="none" stroke="#1B1A1E"/><text x="382" y="65">이동 목적지</text><text x="382" y="82" font-size="10.5" opacity=".7">예약 칸=임시 차단으로 FindPath</text>
      <rect x="548" y="46" width="150" height="46" fill="none" stroke="#1B1A1E"/><text x="558" y="65">패턴 추첨 @목적지</text><text x="558" y="82" font-size="10.5" opacity=".7">페이즈·거리창·쿨다운·커버</text>
      <rect x="724" y="46" width="136" height="46" fill="#F0E2DF" stroke="#B33A35"/><text x="734" y="65">TurnPlan 커밋</text><text x="734" y="82" font-size="10.5" opacity=".7">이동 · 조준 잠금 · Pending</text>
      <line x1="170" y1="69" x2="194" y2="69" stroke="#1B1A1E" marker-end="url(#ar2)"/>
      <line x1="346" y1="69" x2="370" y2="69" stroke="#1B1A1E" marker-end="url(#ar2)"/>
      <line x1="522" y1="69" x2="546" y2="69" stroke="#1B1A1E" marker-end="url(#ar2)"/>
      <line x1="698" y1="69" x2="722" y2="69" stroke="#1B1A1E" marker-end="url(#ar2)"/>
    </g>
    <!-- shared predicates box -->
    <rect x="200" y="150" width="480" height="92" fill="#EFEBE4" stroke="#1B1A1E" stroke-dasharray="4 3"/>
    <text x="216" y="172" font-weight="600">공유 술어 — 한 함수를 세 층이 부른다</text>
    <text x="216" y="194" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">AttackShapeLibrary.GetAffectedCells(shape, origin, dir, body)</text>
    <text x="216" y="212" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">ResolveMonsterAttackDamageToPlayer(monster, pattern)</text>
    <text x="216" y="230" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">TryResolveAdvanceAfterAttack · IsLeapLandingClear · CanEnter</text>
    <!-- arrows from TurnPlan down -->
    <line x1="792" y1="92" x2="792" y2="290" stroke="#1B1A1E" stroke-width="1.2"/>
    <line x1="792" y1="290" x2="640" y2="290" stroke="#1B1A1E" stroke-width="1.2"/>
    <line x1="792" y1="290" x2="250" y2="290" stroke="#1B1A1E" stroke-width="1.2"/>
    <!-- bottom: preview / resolve -->
    <rect x="20" y="300" width="380" height="80" fill="none" stroke="#1B1A1E"/>
    <text x="32" y="322" font-weight="600">예고 — GetMonsterIntentPreviews (CombatState.cs:663)</text>
    <text x="32" y="342" font-size="11.5">TurnPlan.PlannedMoveCoord + 잠긴 조준으로 형상을 편다</text>
    <text x="32" y="360" font-size="11.5">피해 숫자는 집행과 같은 함수의 <tspan font-weight="600">현재값</tspan> — 상태가 바뀌면 숫자도 바뀐다</text>
    <rect x="470" y="300" width="390" height="80" fill="none" stroke="#1B1A1E"/>
    <text x="482" y="322" font-weight="600">해소 — ResolveMonsterMovementStep / AttackStep</text>
    <text x="482" y="342" font-size="11.5">목적지는 그대로, 경로는 <tspan font-weight="600">현재 점유</tspan>로 다시 FindPath (CombatState.cs:1514)</text>
    <text x="482" y="360" font-size="11.5">도착 후 커버를 <tspan font-weight="600">다시 묻고</tspan> 못 덮으면 빗맞음 연출 (:742)</text>
    <line x1="250" y1="290" x2="250" y2="298" stroke="#1B1A1E" marker-end="url(#ar2)"/>
    <line x1="640" y1="290" x2="640" y2="298" stroke="#1B1A1E" marker-end="url(#ar2)"/>
    <line x1="440" y1="242" x2="440" y2="300" stroke="#1B1A1E" stroke-dasharray="2 3" opacity=".6"/>
    <line x1="440" y1="150" x2="440" y2="92" stroke="#1B1A1E" stroke-dasharray="2 3" opacity=".6"/>
  </g>
</svg>