<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="암시야 데이터 흐름 — 원본 셀에서 셰이더까지"><rect x="0" y="0" width="880" height="420" fill="#FFFDFA"/>
  <defs><marker id="v1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/></marker></defs>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12" fill="#1B1A1E">
    <text x="20" y="24" font-weight="600">규칙층 (순수 C#)</text>
    <rect x="20" y="40" width="200" height="60" fill="none" stroke="#1B1A1E"/>
    <text x="30" y="60" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">HexCellData (원본)</text>
    <text x="30" y="78" font-size="11">지형·비용·보행·타일id·이벤트·랜드마크</text>
    <text x="30" y="92" font-size="11" opacity=".7">Map.Runtime · 1,938칸</text>

    <rect x="20" y="130" width="200" height="74" fill="#EFEBE4" stroke="#1B1A1E"/>
    <text x="30" y="150" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">HexVisibilityRuntime</text>
    <text x="30" y="166" font-size="11">states(칸→단계) · temporary · permanent · trap</text>
    <text x="30" y="182" font-size="11">SetVisibility=단조 승급 · ForceVisibility=유일 강등</text>
    <text x="30" y="197" font-size="11">Version++ (실변경만)</text>

    <rect x="20" y="234" width="200" height="60" fill="none" stroke="#1B1A1E"/>
    <text x="30" y="254" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">CombatState.RefreshPlayerVision</text>
    <text x="30" y="270" font-size="11">시야 원판 ∪ 필드오브젝트 ∪ 이번 턴 정찰</text>
    <text x="30" y="285" font-size="11" opacity=".7">호출부 16곳 · 매번 합집합 재구성</text>
    <line x1="120" y1="234" x2="120" y2="206" stroke="#1B1A1E" marker-end="url(#v1)"/>

    <!-- filter -->
    <rect x="270" y="130" width="190" height="74" fill="#F0E2DF" stroke="#B33A35" stroke-width="1.3"/>
    <text x="280" y="150" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">GetSafeCellInfo(coord)</text>
    <text x="280" y="166" font-size="11">Missing / Unknown / Hinted / Revealed</text>
    <text x="280" y="182" font-size="11">단계별로 <tspan font-weight="600">빈 문자열</tspan>을 돌려준다</text>
    <text x="280" y="197" font-size="11" opacity=".7">원본 cell은 이 함수 밖으로 안 나간다</text>
    <line x1="220" y1="70" x2="268" y2="150" stroke="#1B1A1E" stroke-dasharray="3 3" marker-end="url(#v1)"/>
    <line x1="220" y1="167" x2="268" y2="167" stroke="#1B1A1E" marker-end="url(#v1)"/>

    <text x="500" y="24" font-weight="600">표현층 (Unity)</text>
    <rect x="500" y="40" width="360" height="54" fill="none" stroke="#1B1A1E"/>
    <text x="510" y="60" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">ICombatVisibilityRenderer.ApplyVisibility(provider, epoch)</text>
    <text x="510" y="78" font-size="11">epoch = VisibilityVersion&lt;&lt;1 | revealAll · 같으면 <tspan font-weight="600">즉시 반환</tspan></text>
    <line x1="460" y1="167" x2="498" y2="70" stroke="#1B1A1E" marker-end="url(#v1)"/>

    <rect x="500" y="118" width="360" height="86" fill="none" stroke="#1B1A1E"/>
    <text x="510" y="138" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">AtlasTilePresentationView.ApplyVisibility</text>
    <text x="510" y="154" font-size="11">① 프리패스: 칸마다 provider 1회 → SafeInfoCache</text>
    <text x="510" y="169" font-size="11">② 칸별 (Exists,Visibility,ring) 키 비교 → <tspan font-weight="600">바뀐 칸만</tspan> 재적용</text>
    <text x="510" y="184" font-size="11">③ 오브젝트 표시 규칙 · 안개 파티클 셀 집합(revision)</text>
    <text x="510" y="199" font-size="11" opacity=".7">뷰는 지오메트리를 그리려 HexMapData도 든다 — 은닉은 「판정」에 걸린다</text>
    <line x1="680" y1="94" x2="680" y2="116" stroke="#1B1A1E" marker-end="url(#v1)"/>

    <rect x="500" y="230" width="360" height="72" fill="#EFEBE4" stroke="#1B1A1E"/>
    <text x="510" y="250" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">VisibilityLightingMaskService.Update</text>
    <text x="510" y="266" font-size="11">칸→슬롯 바이트(4,5xx) → 텍셀→슬롯 LUT gather(128²) → 박스블러 → R8 업로드</text>
    <text x="510" y="281" font-size="11">슬롯 바이트가 전부 같으면 <tspan font-weight="600">fill·blur·upload 전부 스킵</tspan></text>
    <text x="510" y="296" font-size="11" opacity=".7">Shader.SetGlobal* 10개</text>
    <line x1="680" y1="204" x2="680" y2="228" stroke="#1B1A1E" marker-end="url(#v1)"/>

    <rect x="500" y="328" width="360" height="72" fill="none" stroke="#1B1A1E"/>
    <text x="510" y="348" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">MapVisibilityLit.shader · VisibilityLitPassFragment</text>
    <text x="510" y="364" font-size="11">월드→맵로컬 → (육각 셀 중심 스냅) → 마스크 샘플 → 하드엣지 lerp</text>
    <text x="510" y="379" font-size="11">color.rgb *= mask · emission은 floor까지만 어두워짐 · NaN 스크럽</text>
    <text x="510" y="394" font-size="11" opacity=".7">URP Lit 포워드 패스 복제 + 자작 59줄</text>
    <line x1="680" y1="302" x2="680" y2="326" stroke="#1B1A1E" marker-end="url(#v1)"/>
  </g>
</svg>