<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="세 단계가 각 표면에서 어떻게 보이는가"><rect x="0" y="0" width="880" height="250" fill="#FFFDFA"/>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12" fill="#1B1A1E">
    <text x="20" y="24" font-weight="600">같은 세 단계, 표면마다 다른 해석 — 타일 밝기에서는 Hinted = Unknown</text>
    <g font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">
      <text x="140" y="56" text-anchor="middle" font-weight="600">Unknown</text>
      <text x="420" y="56" text-anchor="middle" font-weight="600">Hinted</text>
      <text x="700" y="56" text-anchor="middle" font-weight="600">Revealed</text>
    </g>
    <text x="20" y="90" font-size="11.5" opacity=".8">타일 밝기</text>
    <rect x="80" y="74" width="120" height="22" fill="#1B1A1E" opacity=".9"/><text x="140" y="90" text-anchor="middle" font-size="10.5" fill="#F6F3EE">0.10</text>
    <rect x="360" y="74" width="120" height="22" fill="#1B1A1E" opacity=".9"/><text x="420" y="90" text-anchor="middle" font-size="10.5" fill="#F6F3EE">0.10 (결정)</text>
    <rect x="640" y="74" width="120" height="22" fill="none" stroke="#1B1A1E"/><text x="700" y="90" text-anchor="middle" font-size="10.5">1.00</text>
    <text x="20" y="128" font-size="11.5" opacity=".8">오브젝트</text>
    <text x="140" y="128" text-anchor="middle" font-size="11">건물·기억석·서비스만 (어둡게)</text>
    <text x="420" y="128" text-anchor="middle" font-size="11">발견한 것 전부 (어둡게)</text>
    <text x="700" y="128" text-anchor="middle" font-size="11">전부 · 원색</text>
    <text x="20" y="162" font-size="11.5" opacity=".8">미니맵</text>
    <rect x="80" y="148" width="120" height="20" fill="#2E3438"/><text x="140" y="162" text-anchor="middle" font-size="10.5" fill="#ddd">0.18/0.20/0.22</text>
    <rect x="360" y="148" width="120" height="20" fill="#4D5C66"/><text x="420" y="162" text-anchor="middle" font-size="10.5" fill="#eee">0.30/0.36/0.40</text>
    <text x="700" y="162" text-anchor="middle" font-size="11">지형색</text>
    <text x="20" y="196" font-size="11.5" opacity=".8">툴팁 문장</text>
    <text x="140" y="196" text-anchor="middle" font-size="11">「Unknown. Details hidden」</text>
    <text x="420" y="196" text-anchor="middle" font-size="11">지형·보행 가능 여부만</text>
    <text x="700" y="196" text-anchor="middle" font-size="11">이동비용·랜드마크·이벤트</text>
    <text x="20" y="230" font-size="11.5" opacity=".8">몬스터</text>
    <text x="140" y="230" text-anchor="middle" font-size="11">안 보임 · 예고 없음</text>
    <text x="420" y="230" text-anchor="middle" font-size="11">안 보임 · 예고 없음</text>
    <text x="700" y="230" text-anchor="middle" font-size="11">마커·예고·활동 승격</text>
  </g>
</svg>