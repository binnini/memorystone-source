      <text x="450" y="225" text-anchor="middle" opacity=".8">Hold :321 (최종 상태 저장 후 스냅샷 복원) → 임팩트 비트마다 CommitImpact(groupId) :333 → Finish :362 (정상·취소·일시정지 3경로)</text>
      <text x="450" y="242" text-anchor="middle" opacity=".7">⚠ 버퍼(발사 시점만 미룸)와 되감기(HP·좌표·페이즈를 실제로 되돌림)는 다른 것 — EffectPresentationBuffer.cs:14–19</text>
      <text x="450" y="270" text-anchor="middle" opacity=".7">왼쪽 두 상자는 UnityEngine을 모른다. 세 번째는 Unity 어셈블리지만 Unity 참조가 없는 클래스라 EditMode에서 RecordingSink로 돈다.</text>
