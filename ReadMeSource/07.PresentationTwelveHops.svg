      <text x="360" y="80" text-anchor="middle" opacity=".8">BuildPlayerAttack :135 · BuildEndAction :231</text>
      <text x="360" y="97" text-anchor="middle" opacity=".8">→ CombatTimeline = List&lt;Event&gt;</text>
      <text x="360" y="114" text-anchor="middle" opacity=".8">Sequence 단조 · 초 없음 · 27 kind</text>
      <text x="585" y="60" text-anchor="middle" font-weight="500">PresentationScheduler</text>
