<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="카드 한 장이 CSV에서 소멸 더미까지 가는 길"><rect x="0" y="0" width="880" height="470" fill="#FFFDFA"/>
  <defs><marker id="j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/></marker></defs>
  <g font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12" fill="#1B1A1E">
    <text x="20" y="22" font-weight="600">저작 → 베이크 → 덱 → 손패 → 집행 → 더미 (파일:줄은 2026-09-05 · cs:1375)</text>
    <rect x="20" y="40" width="260" height="78" fill="none" stroke="#1B1A1E"/>
<text x="30" y="60" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">cards.csv (32컬럼 · 59행)</text>
<text x="30" y="77" font-size="11">A15 D8 F5 M8 S7 U4 X12 · 컬럼 순서 고정</text>
<text x="30" y="92" font-size="11">card_upgrades.csv 24행 병합 → UpgradedEntry</text>
<text x="30" y="107" font-size="11">game_keywords.csv 52행은 텍스트 매칭용</text>
    <rect x="310" y="40" width="260" height="78" fill="#EFEBE4" stroke="#1B1A1E"/>
<text x="320" y="60" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">CardCatalogAsset (임포트·베이크)</text>
<text x="320" y="77" font-size="11">ValidateRow → BuildEntry → CardCatalog.asset</text>
<text x="320" y="92" font-size="11">behaviorParams allow-list · 형식 검증</text>
<text x="320" y="107" font-size="11">죽은 컬럼 scout · 0건 컬럼 exhaustOnPlay</text>
    <line x1="280" y1="79" x2="308" y2="79" stroke="#1B1A1E" marker-end="url(#j1)"/>
    <rect x="600" y="40" width="260" height="78" fill="none" stroke="#1B1A1E"/>
<text x="610" y="60" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">CardCatalogDefinition → Entry</text>
<text x="610" y="77" font-size="11">ToCardDefinition(sourceId, instanceId, upgrade)</text>
<text x="610" y="92" font-size="11">연마 치환은 여기서(정의 시점)</text>
<text x="610" y="107" font-size="11">CardDefinition = 불변 값 객체</text>
    <line x1="570" y1="79" x2="598" y2="79" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="600" y="150" width="260" height="78" fill="none" stroke="#1B1A1E"/>
<text x="610" y="170" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">StartingDeck_Prototype.asset (20장)</text>
<text x="610" y="187" font-size="11">이동 7 · 행동 13 → PlayerDeckData</text>
<text x="610" y="202" font-size="11">인스턴스 id = prototype.M01.000 …</text>
<text x="610" y="217" font-size="11">FromCatalog(46장)은 에셋 없을 때 폴백</text>
    <line x1="730" y1="118" x2="730" y2="148" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="310" y="150" width="260" height="78" fill="#F0E2DF" stroke="#B33A35"/>
<text x="320" y="170" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">CardDeckState × 2 (CombatState:166~168)</text>
<text x="320" y="187" font-size="11">이동덱 · 행동덱 각자 4더미(뽑을·손·버림·소멸)</text>
<text x="320" y="202" font-size="11">DeckShuffleFor: 시드 스트림 8 / 9</text>
<text x="320" y="217" font-size="11">CreateDeck(shuffleDecks) → ShuffleDrawPile</text>
    <line x1="598" y1="189" x2="572" y2="189" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="20" y="150" width="260" height="78" fill="none" stroke="#1B1A1E"/>
<text x="30" y="170" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">DrawNewTurnHands (CombatState:6847)</text>
<text x="30" y="187" font-size="11">목표 = 정원(2/5 + 유물) + 유지분 − 현재</text>
<text x="30" y="202" font-size="11">이동 Draw · 행동 DrawActionCards(미련 훅)</text>
<text x="30" y="217" font-size="11">시작: 즉시 or StartPlayerTurn(:3172)</text>
    <line x1="308" y1="189" x2="282" y2="189" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="20" y="260" width="260" height="92" fill="none" stroke="#1B1A1E"/>
<text x="30" y="280" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">사용 (Try*Card → CardEffects 핸들러 맵)</text>
<text x="30" y="297" font-size="11">게이트: 페이즈·기절·무장해제·상태카드·봉인</text>
<text x="30" y="312" font-size="11">IsSealedCard(:5912) = (InstanceId, 턴) 해시 순위</text>
<text x="30" y="327" font-size="11">ConsumePlayedCard(:6171) → 버림 / 소멸</text>
<text x="30" y="342" font-size="11">U01만 DiscardHand() 전량 재드로우(:2696)</text>
    <line x1="150" y1="228" x2="150" y2="258" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="310" y="260" width="260" height="92" fill="#EFEBE4" stroke="#1B1A1E"/>
<text x="320" y="280" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">턴말 DiscardRemainingHands (:6818)</text>
<text x="320" y="297" font-size="11">DiscardHandExcept(IsRetainedOnTurnEnd)</text>
<text x="320" y="312" font-size="11">유지 카드(D07·M07)는 손에 남는다</text>
<text x="320" y="327" font-size="11">PurgeCopiesFromActionHand(:4943) 아지랑이 소멸</text>
<text x="320" y="342" font-size="11">↩ 다음 턴 DrawNewTurnHands</text>
    <line x1="280" y1="306" x2="308" y2="306" stroke="#1B1A1E" marker-end="url(#j1)"/>

    <rect x="600" y="260" width="260" height="92" fill="none" stroke="#1B1A1E"/>
<text x="610" y="280" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">더미 규칙 (DeckState.cs)</text>
<text x="610" y="297" font-size="11">Draw(:47) 바닥나면 ReshuffleDiscardIntoDraw(:248)</text>
<text x="610" y="312" font-size="11">소멸 더미는 재편성 대상 아님</text>
<text x="610" y="327" font-size="11">InjectIntoDrawPile 섞음 · InjectIntoHand 안 섞음</text>
<text x="610" y="342" font-size="11">PermanentRemoveAnywhere(:191) = 상점 제거</text>
    <line x1="570" y1="306" x2="598" y2="306" stroke="#1B1A1E" stroke-dasharray="3 3" marker-end="url(#j1)"/>

    <rect x="20" y="380" width="840" height="70" fill="none" stroke="#1B1A1E"/>
<text x="30" y="400" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">세이브 (PlayerRunSaveData.cs:122~130 · 169~181 · 310~315)</text>
<text x="30" y="417" font-size="11">PlayerDeckSaveData = 런 덱(MoveCards/ActionCards) + 전투 4더미 zones(MovementZones/ActionZones) + 더미 수 요약(MoveDeck/ActionDeck) — 덱 2벌이 세 층으로 실린다</text>
<text x="30" y="432" font-size="11">Suspend 복원(CombatState.Suspend.cs:273~277): zones → CardDeckState 4-인자 생성자(순서 보존) + DeckShuffleFor 재주입 · 봉인은 저장 안 함(유도값)</text>
    <line x1="440" y1="352" x2="440" y2="378" stroke="#1B1A1E" marker-end="url(#j1)"/>
  </g>
</svg>