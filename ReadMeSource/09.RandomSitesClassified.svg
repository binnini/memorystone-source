<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 760 250" role="img" aria-label="난수 표면 24건의 분류. 이미 시드 기반 6건, 시드 자리는 있으나 배선 안 된 2건, 무시드 7건, 재현 대상 아닌 연출용 7건, 도구 2건."><rect x="0" y="0" width="760" height="250" fill="#FFFDFA"/>
        <text x="0" y="16" font-size="11" fill="#1B1A1E" opacity=".6">난수 사용처 24건 (Tests · /Dev/ 제외)</text>

        <text x="176" y="52" text-anchor="end" font-size="12" fill="#1B1A1E">✅ 이미 시드 기반</text>
        <rect x="188" y="38" width="150" height="20" fill="#4A6B52"/>
        <text x="348" y="52" font-size="11.5" fill="#1B1A1E">6 — 배치 · 함정 · 상자 · 서비스 · HP변주</text>

        <text x="176" y="84" text-anchor="end" font-size="12" fill="#1B1A1E">⚠️ 자리만 있고 배선 안 됨</text>
        <rect x="188" y="70" width="50" height="20" fill="#8A6A22"/>
        <text x="248" y="84" font-size="11.5" fill="#1B1A1E">2 — 몬스터 패턴 · 피해 지터 (시드 항상 0)</text>

        <text x="176" y="116" text-anchor="end" font-size="12" fill="#B33A35" font-weight="600">❌ 무시드 — 작업 대상</text>
        <rect x="188" y="102" width="175" height="20" fill="#B33A35"/>
        <text x="373" y="116" font-size="11.5" fill="#1B1A1E" font-weight="500">7 — 덱 셔플 · 보상 · 전투판정 · 보스 · id 2 · 런시드</text>

        <text x="176" y="148" text-anchor="end" font-size="12" fill="#1B1A1E">— 재현 불필요 (연출)</text>
        <rect x="188" y="134" width="175" height="20" fill="#1B1A1E" opacity=".22"/>
        <text x="373" y="148" font-size="11.5" fill="#1B1A1E" opacity=".7">7 — 사운드 피치 · 카메라 흔들림 · 시네마틱(이미 시드)</text>

        <text x="176" y="180" text-anchor="end" font-size="12" fill="#1B1A1E">— 도구</text>
        <rect x="188" y="166" width="50" height="20" fill="#1B1A1E" opacity=".22"/>
        <text x="248" y="180" font-size="11.5" fill="#1B1A1E" opacity=".7">2</text>

        <line x1="0" y1="206" x2="760" y2="206" stroke="#1B1A1E" stroke-width="1" opacity=".2"/>
        <text x="0" y="230" font-size="12" fill="#1B1A1E">규칙 결과를 바꾸는 난수 <tspan font-weight="600">15건</tspan> 중 <tspan fill="#4A6B52" font-weight="600">6건만 재현</tspan>된다 — <tspan fill="#B33A35" font-weight="600">9건이 남았다</tspan>.</text>
      </svg>