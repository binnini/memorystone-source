<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 760 320" role="img" aria-label="현재는 런 시드가 배치 계열까지만 파생되고 전투와 보상과 덱은 끊겨 있다. 시드화 후에는 하나의 런 시드에서 여덟 개 스트림이 모두 파생된다."><rect x="0" y="0" width="760" height="320" fill="#FFFDFA"/>
        <defs>
          <marker id="s9a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1B1A1E"/>
          </marker>
          <marker id="s9r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#B33A35"/>
          </marker>
        </defs>

        <text x="16" y="18" font-size="11.5" fill="#1B1A1E" opacity=".65">지금</text>
        <rect x="16" y="30" width="112" height="34" fill="none" stroke="#1B1A1E" stroke-width="1.4"/>
        <text x="72" y="51" text-anchor="middle" font-size="11.5" fill="#1B1A1E">런 시드</text>

        <g font-size="11" fill="#1B1A1E">
          <line x1="128" y1="47" x2="176" y2="34" stroke="#1B1A1E" stroke-width="1" marker-end="url(#s9a)"/>
          <text x="182" y="37">① 몬스터 배치</text>
          <line x1="128" y1="47" x2="176" y2="52" stroke="#1B1A1E" stroke-width="1" marker-end="url(#s9a)"/>
          <text x="182" y="55">② 함정 · 상자</text>
          <line x1="128" y1="47" x2="176" y2="70" stroke="#1B1A1E" stroke-width="1" marker-end="url(#s9a)"/>
          <text x="182" y="73">③ 서비스 · HP변주</text>
        </g>

        <line x1="300" y1="96" x2="470" y2="96" stroke="#B33A35" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text x="306" y="90" font-size="11" fill="#B33A35">여기서 끊긴다</text>

        <g font-size="11" fill="#B33A35">
          <rect x="176" y="112" width="150" height="22" fill="none" stroke="#B33A35" stroke-width="1"/>
          <text x="186" y="127">덱 셔플 — 무시드</text>
          <rect x="176" y="140" width="150" height="22" fill="none" stroke="#B33A35" stroke-width="1"/>
          <text x="186" y="155">보상 — UnityRandom</text>
          <rect x="176" y="168" width="150" height="22" fill="none" stroke="#B33A35" stroke-width="1"/>
          <text x="186" y="183">전투 판정 6종 — 무시드</text>
          <rect x="176" y="196" width="150" height="22" fill="none" stroke="#B33A35" stroke-width="1"/>
          <text x="186" y="211">보스 기물 · 카드 id</text>
        </g>
        <text x="340" y="168" font-size="11.5" fill="#B33A35" font-weight="600">매 실행마다 다르다</text>

        <line x1="410" y1="16" x2="410" y2="300" stroke="#1B1A1E" stroke-width="1" opacity=".22"/>

        <text x="432" y="18" font-size="11.5" fill="#4A6B52">시드화 이후</text>
        <rect x="432" y="30" width="112" height="34" fill="none" stroke="#4A6B52" stroke-width="1.8"/>
        <text x="488" y="45" text-anchor="middle" font-size="11.5" fill="#1B1A1E">런 시드</text>
        <text x="488" y="58" text-anchor="middle" font-size="9.5" fill="#1B1A1E" opacity=".6">사용자 입력 가능</text>

        <g font-size="10.5" fill="#1B1A1E">
          <line x1="544" y1="47" x2="586" y2="88" stroke="#4A6B52" stroke-width="1" marker-end="url(#s9a)"/>
          <text x="592" y="34">① 몬스터 배치</text>
          <text x="592" y="52">② 함정 · 상자</text>
          <text x="592" y="70">③ 서비스 · HP변주</text>
          <text x="592" y="88">④ 몬스터 패턴</text>
          <text x="592" y="106">⑤ 전투 판정</text>
          <text x="592" y="124">⑥ 보스 기물</text>
          <text x="592" y="142">⑦ 보상 · 상점 · 가차</text>
          <text x="592" y="160">⑧ 덱 셔플</text>
        </g>
        <text x="432" y="196" font-size="11.5" fill="#4A6B52" font-weight="600">DeriveSeed(runSeed, n)</text>
        <text x="432" y="214" font-size="11" fill="#1B1A1E" opacity=".7">스트림 독립 — 한쪽 소비량이</text>
        <text x="432" y="230" font-size="11" fill="#1B1A1E" opacity=".7">바뀌어도 다른 쪽이 안 흔들린다</text>

        <line x1="16" y1="256" x2="744" y2="256" stroke="#1B1A1E" stroke-width="1" opacity=".2"/>
        <text x="16" y="280" font-size="12" fill="#1B1A1E">스트림 분리 규율(<tspan font-weight="600">DeriveSeed</tspan>)은 <tspan fill="#4A6B52" font-weight="600">이미 있다</tspan> — 새로 만드는 것이 아니라 <tspan font-weight="600">4번부터 이어 쓰는 것</tspan>이다.</text>
        <text x="16" y="302" font-size="12" fill="#1B1A1E">새로 만드는 클래스는 <tspan font-weight="600">하나</tspan>(시드 기반 IRewardRandom). 나머지는 <tspan font-weight="600">배선</tspan>이다.</text>
      </svg>