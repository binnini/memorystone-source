<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 900 250" width="900" height="250" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1B1A1E"><rect x="0" y="0" width="900" height="250" fill="#FFFDFA"/>
        <g stroke="#1B1A1E" fill="none" stroke-width="1.2">
          <rect x="10" y="30" width="280" height="190" rx="3"/><rect x="310" y="30" width="280" height="190" rx="3"/><rect x="610" y="30" width="280" height="190" rx="3"/>
        </g>
        <text x="150" y="20" text-anchor="middle" font-weight="600">몬스터 (objectRef 치환)</text>
        <text x="450" y="20" text-anchor="middle" font-weight="600">함정 (presetId 치환)</text>
        <text x="750" y="20" text-anchor="middle" font-weight="600">상자·서비스 (좌표 치환)</text>
        <!-- monster: group of N slots, K occupied -->
        <g>
          <g fill="#1B1A1E"><circle cx="45" cy="70" r="9"/><circle cx="75" cy="70" r="9"/><circle cx="105" cy="70" r="9"/></g>
          <g fill="none" stroke="#1B1A1E" stroke-dasharray="3 2"><circle cx="135" cy="70" r="9"/><circle cx="165" cy="70" r="9"/><circle cx="195" cy="70" r="9"/><circle cx="225" cy="70" r="9"/><circle cx="255" cy="70" r="9"/></g>
          <text x="150" y="100" text-anchor="middle" font-size="11">mon-a: 8슬롯 중 점유 3 → 매 판 3칸을 뽑는다</text>
          <text x="150" y="122" text-anchor="middle" font-size="11">뽑은 칸에 설 몬스터는 그룹 풀에서 가중 추첨</text>
          <text x="150" y="150" text-anchor="middle" font-size="11">유지: 슬롯 id·좌표·patrolAreaId·purpose</text>
          <text x="150" y="168" text-anchor="middle" font-size="11">바뀜: monsterId·role(풀 행이 정본)</text>
          <text x="150" y="200" text-anchor="middle" font-size="11">보스 M002·기물은 태그 없음 + role 필터 2중</text>
        </g>
        <g>
          <g fill="#1B1A1E"><rect x="336" y="61" width="18" height="18"/><rect x="366" y="61" width="18" height="18"/><rect x="396" y="61" width="18" height="18"/><rect x="426" y="61" width="18" height="18"/><rect x="456" y="61" width="18" height="18"/></g>
          <g fill="none" stroke="#1B1A1E" stroke-dasharray="3 2"><rect x="486" y="61" width="18" height="18"/><rect x="516" y="61" width="18" height="18"/><rect x="546" y="61" width="18" height="18"/></g>
          <text x="450" y="100" text-anchor="middle" font-size="11">trap-early: 24슬롯 중 점유 15 → 15칸, 쌍별 거리 ≥ 2</text>
          <text x="450" y="122" text-anchor="middle" font-size="11">최소 거리는 그룹 경계를 넘어 누적(takenCoords)</text>
          <text x="450" y="150" text-anchor="middle" font-size="11">유지: trapId·좌표 · 바뀜: 프리셋 내용 전부</text>
          <text x="450" y="168" text-anchor="middle" font-size="11">안 뽑힌 점유 슬롯은 걷어낸다(cs:1178 수리)</text>
          <text x="450" y="200" text-anchor="middle" font-size="11">예비 = 태그 있음 + presetId·effects 비어 있음</text>
        </g>
        <g>
          <g fill="none" stroke="#1B1A1E"><rect x="640" y="61" width="18" height="18" rx="2"/><rect x="700" y="61" width="18" height="18" rx="2"/><rect x="760" y="61" width="18" height="18" rx="2"/></g>
          <g stroke="#1B1A1E" stroke-width="1" marker-end="url(#ar)" fill="none"><path d="M649 79 L 670 105"/><path d="M709 79 L 690 105"/><path d="M769 79 L 800 105"/></g>
          <text x="750" y="122" text-anchor="middle" font-size="11">개수·objectId·objectRef 고정, 좌표만</text>
          <text x="750" y="150" text-anchor="middle" font-size="11">상자 24: 후보 칸을 런타임 계산(§6-6 제외 규칙)</text>
          <text x="750" y="168" text-anchor="middle" font-size="11">서비스 3+3: 후보 = 저작 슬롯 18(svc- 태그)만</text>
          <text x="750" y="186" text-anchor="middle" font-size="11">+ 루트 커버리지 검증(각 루트 ≥ 2회) 재롤</text>
          <text x="750" y="208" text-anchor="middle" font-size="11">objectId가 소비 기록의 키라 이 문법을 골랐다</text>
        </g>
      </svg>