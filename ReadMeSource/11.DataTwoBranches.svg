      <text x="425" y="72" text-anchor="middle" opacity=".8">CombatCatalogTextAssetSource.asset이</text>
      <text x="425" y="88" text-anchor="middle" opacity=".8">GUID로 TextAsset 참조 → 전투 진입 시 변환</text>
      <text x="425" y="108" text-anchor="middle" opacity=".8">저장 = 반영 · 깨지면 진입에서 예외 · 폴백 없음</text>
      <text x="425" y="192" text-anchor="middle" font-weight="500">베이크 6 (수동 메뉴)</text>
