<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 900 300" width="900" height="300" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#1B1A1E"><rect x="0" y="0" width="900" height="300" fill="#FFFDFA"/>
