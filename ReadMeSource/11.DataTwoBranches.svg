      <text x="425" y="228" text-anchor="middle" opacity=".8">keywords · vfx · sound · manifest · timing</text>
      <text x="425" y="248" text-anchor="middle" opacity=".8">안 구우면 조용히 구 에셋 사용 → stale</text>
      <text x="765" y="52" text-anchor="middle" font-weight="500">런타임 카탈로그</text>
