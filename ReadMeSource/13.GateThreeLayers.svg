<svg xmlns="http://www.w3.org/2000/svg" style="color:#1B1A1E" viewBox="0 0 900 250" width="900" height="250" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1B1A1E"><rect x="0" y="0" width="900" height="250" fill="#FFFDFA"/>
      <g stroke="#1B1A1E" fill="none" stroke-width="1">
        <rect x="20" y="30" width="260" height="180" rx="4"/>
        <rect x="320" y="30" width="260" height="180" rx="4"/>
        <rect x="620" y="30" width="260" height="180" rx="4"/>
      </g>
      <text x="150" y="20" text-anchor="middle" font-size="11" letter-spacing="2">1층 · 컴파일러 · 항상</text>
      <text x="450" y="20" text-anchor="middle" font-size="11" letter-spacing="2">2층 · 테스트 · tests-run</text>
      <text x="750" y="20" text-anchor="middle" font-size="11" letter-spacing="2">3층 · 감사 툴 · 호출 시</text>
      <g font-size="11.5">
        <text x="34" y="58">asmdef 참조 그래프 13개</text>
        <text x="34" y="80">noEngineReferences=true 3개</text>
        <text x="34" y="102">→ 규칙층이 UnityEngine을</text>
        <text x="34" y="120">   using 하면 빌드가 깨진다</text>
        <text x="34" y="150">defineConstraints</text>
        <text x="34" y="172">비용: 0 (실패 = 컴파일 에러)</text>
        <text x="34" y="196" opacity=".6">막는 것: 층 경계 위반</text>
        <text x="334" y="58">EditMode 2,503건</text>
        <text x="334" y="80">상시 = 대표 케이스만</text>
        <text x="334" y="102">[Explicit] 12 → skip 55</text>
        <text x="334" y="120">   (렌더 매트릭스·성능·VFX 전수)</text>
        <text x="334" y="150">골든 베이스라인 JSON fail-closed</text>
        <text x="334" y="172">게이트 = 「신규 실패 0」</text>
        <text x="334" y="196" opacity=".6">막는 것: 규칙·계약 회귀</text>
        <text x="634" y="58">자작 MCP 툴 12종 3,255줄</text>
        <text x="634" y="80">CSV 변환·베이크 최신성</text>
        <text x="634" y="102">씬 배선·UI 계약·연출 길이</text>
        <text x="634" y="120">사운드·세이브 왕복·보드</text>
        <text x="634" y="150">읽기 전용 · JSON 리포트</text>
        <text x="634" y="172">비용: 호출 1회</text>
        <text x="634" y="196" opacity=".6">막는 것: 저작 표면 드리프트</text>
      </g>
      <text x="450" y="238" text-anchor="middle" font-size="11" opacity=".7">왼쪽일수록 자동, 오른쪽일수록 「누가 부르고 누가 읽는가」에 걸린다 — 오늘의 발견은 3층에서 났다</text>
    </svg>