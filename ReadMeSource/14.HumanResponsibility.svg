<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="사람이 책임지는 영역. 구현은 AI가 쓰고 사람은 기획·판단·검증을 맡는다. 네 축마다 기계가 지키는 장치가 하나씩 있다." style="color:#1B1A1E" font-family="IBM Plex Sans KR,Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,system-ui,sans-serif" font-size="12">
<rect x="0" y="0" width="900" height="360" fill="#FFFDFA"/>
<!-- top band: human -->
<rect x="20" y="24" width="860" height="86" fill="#F0E2DF" stroke="#B33A35" stroke-width="1.5"/>
<text x="34" y="48" fill="#B33A35" font-weight="600" font-size="13">사람 — 기획 · 판단 · 검증</text>
<text x="34" y="70" fill="#B33A35" font-size="11.5">실플레이 → 요구 (반복 감쇠 · 유지 규칙 번복)   ·   감사 발견 → 확정 (BFS 전환 · 의도 선택 통일 · 커서 저장)   ·   규칙 채택 · 기각 (저주=카드 · 개전 기각 · 차폐 안 만듦)</text>
<text x="34" y="92" fill="#B33A35" font-size="11.5">결정 로그 86건 · 기각 대안 명시 39건 (2026-09-06)   —   「왜」가 기록에 없는 초기 구조 3건은 판단을 주장하지 않는다</text>
<!-- middle band: AI -->
<rect x="20" y="130" width="860" height="56" fill="none" stroke="#1B1A1E" stroke-width="1.5"/>
<text x="34" y="154" font-weight="600" font-size="13">AI — 구현 · 조사 · 실행</text>
<text x="34" y="176" fill="#55515C" font-size="11.5">Claude Code · Codex 가 코드를 쓴다   ·   Unity MCP 로 테스트 · 감사 · 벤치를 돌린다   ·   병렬 세션이 같은 트리를 바꾼다 → 게이트는 「신규 실패 0」</text>
<!-- bottom: four machine gates -->
<text x="20" y="218" font-weight="600" font-size="12">기계가 지키는 것 — 사람이 다 읽을 수 없으므로 판정을 기계로 옮긴다</text>
<g font-size="11.5">
<rect x="20" y="232" width="205" height="100" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
<text x="32" y="254" font-weight="600">규칙 경계</text>
<text x="32" y="274" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">noEngineReferences</text>
<text x="32" y="294" fill="#55515C" font-size="11">엔진이 새면 컴파일 실패</text>
<text x="32" y="312" fill="#55515C" font-size="11">비용 0 · 항상 (0절)</text>

<rect x="238" y="232" width="205" height="100" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
<text x="250" y="254" font-weight="600">회귀</text>
<text x="250" y="274" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">골든 베이스라인 JSON</text>
<text x="250" y="294" fill="#55515C" font-size="11">정수 일치 · 파일 없으면 실패</text>
<text x="250" y="312" fill="#55515C" font-size="11">돌연변이로 무는지 확인 (13절)</text>

<rect x="456" y="232" width="205" height="100" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
<text x="468" y="254" font-weight="600">데이터</text>
<text x="468" y="274" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">파서 예외 · 감사 툴 12종</text>
<text x="468" y="294" fill="#55515C" font-size="11">미지 토큰은 기본값이 아니라 예외</text>
<text x="468" y="312" fill="#55515C" font-size="11">베이크 stale 검출 (11절)</text>

<rect x="674" y="232" width="206" height="100" fill="none" stroke="#1B1A1E" stroke-width="1.2"/>
<text x="686" y="254" font-weight="600">문서</text>
<text x="686" y="274" font-family="IBM Plex Mono,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">cs:NNNN 스탬프 규칙</text>
<text x="686" y="294" fill="#55515C" font-size="11">수치에는 언제 · 어느 체인지셋인지</text>
<text x="686" y="312" fill="#55515C" font-size="11">880cs 묵은 기준선 사고에서</text>
</g>
<text x="20" y="350" fill="#55515C" font-size="11">약점: 3층(감사 툴)은 호출 시 · 사람이 읽는다 — allOk ≠ anyStale (13절)</text>
</svg>
